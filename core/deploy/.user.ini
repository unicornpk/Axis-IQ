; Claude's tool-calling loop can make up to IQ_ANTHROPIC_MAX_TOOL_ITERATIONS
; (default 4) round trips, each with its own Anthropic call (up to 30s) and
; connector call (up to 10s) — worst case ~160s. Shared hosting's default
; max_execution_time (often 30-60s) would kill a legitimate slow request
; partway through. Applies to this directory (and below) under LSAPI/FPM.
max_execution_time = 180
